  <!-- Supabase JS (UMD global window.supabase) — ใช้เมื่อ WTP_CONFIG.BACKEND === 'supabase' -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>

  <style>
    /* Critical above-the-fold for splash — เขียวชุด BIGDREAM (อ่อนกว่า BIO ~1.5 เฉด) */
    html, body { background: #f5faf6; margin: 0; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9999; transition: opacity 360ms ease;
      background: radial-gradient(1200px 600px at 50% -10%, #e7f6ec 0%, #f5faf6 55%, #eef8f1 100%); }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .box { text-align: center; animation: rise 600ms cubic-bezier(.2,.7,.2,1) both; }
    /* โลโก้เป็นแนวนอน ~4:1 → คุมด้วยความกว้าง (เดิมคุม 168px ไว้สำหรับโลโก้แนวตั้งของ BIO) */
    #splash .logo { width: 260px; max-width: 76vw; height: auto; display: block; margin: 0 auto; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 14px 30px rgba(45, 139, 77, 0.18)); }
    #splash .lbl { margin-top: 22px; color: #5a6478; font: 500 14px/1.4 "IBM Plex Sans Thai", system-ui; letter-spacing: .2px; }
    #splash .bar { margin: 18px auto 0; width: 200px; height: 4px; border-radius: 99px; background: #dcecdf; overflow: hidden; position: relative; }
    /* Material-style indeterminate: 2 แท่งซ้อนกันต่อเนื่อง — มีแท่งวิ่งตลอดเวลา ไม่มีช่องว่าง/รีสตาร์ทกระตุก */
    #splash .bar::before, #splash .bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px;
      background: linear-gradient(90deg, #3ea45f, #62bd85); will-change: left, right; }
    #splash .bar::before { animation: indet1 2.1s cubic-bezier(.65,.815,.735,.395) infinite; }
    #splash .bar::after  { animation: indet2 2.1s cubic-bezier(.165,.84,.44,1) infinite; animation-delay: 1.05s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes indet1 { 0% { left: -35%; right: 100%; } 60% { left: 100%; right: -90%; } 100% { left: 100%; right: -90%; } }
    @keyframes indet2 { 0% { left: -200%; right: 100%; } 60% { left: 107%; right: -8%; } 100% { left: 107%; right: -8%; } }
    .no-anim *, .no-anim *:before, .no-anim *:after { animation-duration: 0ms !important; transition: none !important; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="box">
      <img class="logo" src="bigdream_logo.png?v=20260907" alt="BIG DREAM HOLDINGS" />
      <div class="lbl">กำลังโหลด Financial Console…</div>
      <div class="bar"></div>
    </div>
  </div>

  <div id="root"></div>

  <!-- ── BIGDREAM = BIO ที่ตัดเหลือ 10 หน้า ──────────────────────────────────
       เพิ่มหน้าใหม่ = (1) ก๊อปไฟล์ page_*.jsx จาก BIO มาไว้ใน app/
                       (2) เพิ่ม <script> ที่นี่
                       (3) เพิ่มใน PAGE_GROUPS + case ของ route ใน app/app.jsx
       shared_bits.jsx ต้องมาก่อนไฟล์ page_* เสมอ (เก็บ helper ของหน้าที่ถูกตัด) -->
  <script src="app/config.js?v=20260907e"></script>
  <script src="app/data.js?v=20260907e"></script>
  <script src="app/data_sync.js?v=20260907e"></script>
  <script src="app/data_supabase.js?v=20260907e"></script>
  <script type="text/babel" src="tweaks-panel.jsx?v=20260907e"></script>
  <script type="text/babel" src="app/components.jsx?v=20260907e"></script>
  <script type="text/babel" src="app/shared_bits.jsx?v=20260907e"></script>
  <script type="text/babel" src="app/charts.jsx?v=20260907e"></script>
  <!-- 1 · Executive Cash Flow Dashboard -->
  <script type="text/babel" src="app/page_cashflow_present.jsx?v=20260907e"></script>
  <!-- 2 · Bank Daily -->
  <script type="text/babel" src="app/page_bank_diary.jsx?v=20260907e"></script>
  <!-- 3 · ประวัติรับเงิน -->
  <script type="text/babel" src="app/page_receipts.jsx?v=20260907e"></script>
  <!-- 4 · ใบแจ้งหนี้คงค้าง -->
  <script type="text/babel" src="app/page_invoices.jsx?v=20260907e"></script>

  <!-- 7 · บันทึกยอดธนาคาร (มีแท็บ DATA BANK ข้างใน) -->
  <script type="text/babel" src="app/page_daily_balance.jsx?v=20260907e"></script>
  <!-- 8-10 · ระบบ -->
  <script type="text/babel" src="app/page_audit_log.jsx?v=20260907e"></script>
  <script type="text/babel" src="app/page_backup.jsx?v=20260907e"></script>
  <script type="text/babel" src="app/page_users.jsx?v=20260907e"></script>
  <script type="text/babel" src="app/app.jsx?v=20260907e"></script>

  <script>
    // Hide splash once React mounts
    const obs = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const sp = document.getElementById('splash');
        if (sp) {
          sp.classList.add('gone');
          setTimeout(() => sp.remove(), 400);
        }
        obs.disconnect();
      }
    });
    obs.observe(document.getElementById('root'), { childList: true });
    setTimeout(() => { const sp = document.getElementById('splash'); if (sp) { sp.classList.add('gone'); setTimeout(() => sp.remove(), 400); } }, 4000);
  </script>
</body>
</html>
